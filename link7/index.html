
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Bike Race</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css/normalize.css">
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
    #hud{position:fixed;top:10px;left:10px;color:#fff;z-index:1}
    #fps{font-size:.8rem;opacity:.6}
    #lap{font-size:1.1rem;margin-top:4px}
  </style>
</head>
<body>
  <div id="hud">
    <div id="fps">FPS: 0</div>
    <div id="lap">Lap: 0 | Time: 0.00 s</div>
  </div>

  <!-- main game script -->
  <script type="module" src="js/main.js"></script>

  <!-- libraries -->
  <script src="https://unpkg.com/three@0.165.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/RGBELoader.js"></script>
</body>
</html>
