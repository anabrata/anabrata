<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Milk Tracker (Firebase)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background:#f0f9ff; }
    h1 { margin: 0 0 20px; }
    .calendar { display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
    .day { background:#fff; border:1px solid #ccc; border-radius:6px; padding:10px; text-align:center; cursor:pointer; }
    .day.skipped { background:#fee2e2; border-color:#f87171; text-decoration: line-through; }
    .total { margin:20px 0; font-size:18px; font-weight:bold; }
    .history { margin-top:30px; }
    .history-item { background:#fff; border:1px solid #ddd; margin:6px 0; padding:10px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>🥛 Milk Tracker</h1>
  <div class="total" id="totalAmount">Loading...</div>
  <div class="calendar" id="calendar"></div>
  <div class="history" id="historyList"></div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ✅ Your Firebase config (from Google)
    const firebaseConfig = {
      apiKey: "AIzaSyBgZ2EmnVErmFw41aIIvWqU46OVlHIfFL8",
      authDomain: "milktracker-e4afe.firebaseapp.com",
      projectId: "milktracker-e4afe",
      storageBucket: "milktracker-e4afe.firebasestorage.app",
      messagingSenderId: "698978386100",
      appId: "1:698978386100:web:18b2aad6e6456955b617e1",
      measurementId: "G-Q8NPFFS27K"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PRICE_PER_DAY = 25;
    const userId = "defaultUser"; // later you can replace with Firebase Auth

    function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
    function monthName(y, m) { return new Date(y,m,1).toLocaleString(undefined,{month:"long"}); }

    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const daysCount = daysInMonth(year, month);

    const monthKey = `${userId}_${year}_${month}`;

    async function loadMonth(){
      const ref = doc(db, "milkData", monthKey);
      const snap = await getDoc(ref);
      if (snap.exists()) return snap.data();
      const data = { year, month, days: Array(daysCount).fill(true), createdAt: Date.now() };
      await setDoc(ref, data);
      return data;
    }

    async function saveMonth(data){
      await setDoc(doc(db,"milkData",monthKey), data);
    }

    function render(data){
      const calendarEl = document.getElementById("calendar");
      const totalEl = document.getElementById("totalAmount");
      calendarEl.innerHTML = "";
      const delivered = data.days.filter(Boolean).length;
      const total = delivered * PRICE_PER_DAY;
      totalEl.textContent = `${monthName(year,month)} ${year} • Total: ₹${total}`;

      for(let d=1; d<=daysCount; d++){
        const idx = d-1;
        const div = document.createElement("div");
        div.className = "day" + (data.days[idx] ? "" : " skipped");
        div.textContent = d;
        div.onclick = async ()=>{
          data.days[idx] = !data.days[idx];
          await saveMonth(data);
          render(data);
        };
        calendarEl.appendChild(div);
      }
    }

    async function renderHistory(){
      const listEl = document.getElementById("historyList");
      listEl.innerHTML = "<h2>History</h2>";
      const snap = await getDocs(collection(db,"milkData"));
      snap.forEach(docSnap => {
        const d = docSnap.data();
        if(d.year===year && d.month===month) return; // skip current month
        const delivered = d.days.filter(Boolean).length;
        const skipped = d.days.length - delivered;
        const total = delivered * PRICE_PER_DAY;
        const item = document.createElement("div");
        item.className = "history-item";
        item.textContent = `${monthName(d.year,d.month)} ${d.year} → Delivered: ${delivered}, Skipped: ${skipped}, Total: ₹${total}`;
        listEl.appendChild(item);
      });
    }

    (async ()=>{
      const cur = await loadMonth();
      render(cur);
      renderHistory();
    })();
  </script>
</body>
</html>
