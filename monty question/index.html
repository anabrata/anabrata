<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গণিত অনুশীলন - দুই পাতা (Math Worksheet - 2 Pages)</title>
    
    <!-- Tab bar me logo (favicon) lagane ka code -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Google Fonts for premium appearance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Scripts for PDF conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-workspace: #0f172a;
            --bg-workspace-gradient: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            --header-glass: rgba(15, 23, 42, 0.65);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --sheet-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Workspace Layout styling */
        body {
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            background: var(--bg-workspace-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.6);
        }

        /* Professional Header Bar */
        .workspace-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: var(--header-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 28px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from {
                transform: translate(-50%, -40px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
            100% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.6); }
        }

        .brand-title h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            margin: 1px 0 0 0;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Controls Section inside Header */
        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Premium Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Workspace Preview Area */
        .workspace-preview {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 130px 20px 60px 20px;
            box-sizing: border-box;
            width: 100vw;
            min-height: 100vh;
        }

        .pages-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Fixed Pixel A4 constraints to guarantee perfect mobile rendering/PDF */
        .worksheet-page {
            width: 793px !important;     /* Fixed pixel equivalent of 210mm */
            height: 1122px !important;   /* Fixed pixel equivalent of 297mm */
            min-width: 793px !important;
            min-height: 1122px !important;
            background-color: #ffffff;
            box-sizing: border-box;
            padding: 40px 55px !important;
            position: relative;
            box-shadow: var(--sheet-shadow);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Noto Sans Bengali', Arial, sans-serif;
            color: #000000;
            transition: transform 0.3s ease;
        }

        .worksheet-page:hover {
            transform: translateY(-2px);
        }

        /* Title and Student Info header */
        .sheet-header {
            border-bottom: 2px solid #000;
            padding-bottom: 6px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sheet-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: #000;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .student-info-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .info-field {
            border-bottom: 1px dotted #000;
            padding-bottom: 1px;
        }

        /* Section Layouts */
        .worksheet-section {
            margin-bottom: 10px;
        }

        .worksheet-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #000;
            margin-bottom: 8px;
            border-bottom: 1.5px solid #000;
            padding-bottom: 2px;
            display: flex;
            justify-content: space-between;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .section-title span.sub-title {
            font-size: 11px;
            font-weight: 500;
        }

        /* 10-column compact grid */
        .problem-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            column-gap: 12px;
            row-gap: 8px;
        }

        /* Vertical problems styling (+, -, x) */
        .math-problem {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: relative;
            width: 58px; /* Fixed width to prevent shrinking */
            margin-left: auto;
            box-sizing: border-box;
            font-variant-numeric: tabular-nums;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .row-top {
            text-align: right;
            padding-right: 2px;
            line-height: 1.1;
            height: 20px;
        }

        .row-bottom {
            text-align: right;
            border-bottom: 1.5px solid #000;
            position: relative;
            padding-right: 2px;
            padding-bottom: 2px;
            margin-bottom: 25px; /* Space for answer writing */
            line-height: 1.1;
            width: 100%;
            height: 20px;
        }

        .operator {
            position: absolute;
            left: 0;
            bottom: 2px;
            font-size: 16px;
            font-weight: 600;
        }

        /* Division problems styling */
        .division-problem {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            position: relative;
            width: 100%;
            height: 40px;
            box-sizing: border-box;
            margin-top: 10px; /* Space above for writing quotient */
            margin-bottom: 25px; /* Align with others */
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .divisor {
            padding-right: 2px;
            line-height: 1;
        }

        .dividend-wrap {
            border-left: 1.5px solid #000;
            border-top: 1.5px solid #000;
            padding: 1px 4px 0 4px;
            line-height: 1;
            min-width: 20px;
            text-align: center;
        }

        /* Footer */
        .sheet-footer {
            margin-top: auto;
            text-align: center;
            font-size: 10px;
            color: #666;
            border-top: 1px solid #ccc;
            padding-top: 4px;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        /* Loading overlay styling */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .loading-subtext {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .workspace-header {
                width: 95%;
                padding: 10px 16px;
                border-radius: 12px;
                top: 10px;
            }

            .brand-title p {
                display: none;
            }

            .btn {
                padding: 8px 12px;
                font-size: 12px;
            }

            .workspace-preview {
                padding: 90px 10px 30px 10px;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: #ffffff !important;
            }
            .workspace-header {
                display: none !important;
            }
            .workspace-preview {
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                max-height: none !important;
                display: block !important;
            }
            .pages-container {
                gap: 0 !important;
                transform: none !important;
                height: auto !important;
            }
            .worksheet-page {
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                page-break-after: always;
            }
            .worksheet-page:last-child {
                page-break-after: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Professional Glassmorphism Header Bar -->
    <div class="workspace-header">
        <div class="brand-container">
            <div class="brand-icon">∑</div>
            <div class="brand-title">
                <h2>গণিতপত্র.ai</h2>
                <p>MathPractice Worksheet Creator</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-group">
            <button id="genBtn" class="btn btn-primary" onclick="generateSheet()">
                🔄 নতুন ওয়ার্কশিট
            </button>
            <button id="dlBtn" class="btn btn-secondary" onclick="downloadPDF()">
                ⬇️ PDF ডাউনলোড
            </button>
            <button class="btn btn-secondary" onclick="window.print()">
                🖨️ প্রিন্ট করুন
            </button>
        </div>
    </div>

    <!-- Workspace Preview Area containing fixed size A4 containers -->
    <div class="workspace-preview">
        <div class="pages-container" id="pages-container">
            <!-- Dynamically populated page divs -->
        </div>
    </div>

    <!-- Loading Animation Screen -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">ওয়ার্কশিট তৈরি হচ্ছে...</div>
        <div class="loading-subtext" id="loadingSubtext">অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন</div>
    </div>

    <script>
        // Bengali Digits Map
        const enToBn = {
            '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', 
            '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯'
        };

        function toBengali(num) {
            return num.toString().split('').map(d => enToBn[d] || d).join('');
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // HTML Templates
        function createVerticalMath(operator, num1, num2) {
            return `
                <div class="math-problem">
                    <div class="row-top">${toBengali(num1)}</div>
                    <div class="row-bottom">
                        <span class="operator">${operator}</span>
                        ${toBengali(num2)}
                    </div>
                </div>
            `;
        }

        function createDivision(divisor, dividend) {
            return `
                <div class="division-problem">
                    <div class="divisor">${toBengali(divisor)}</div>
                    <div class="dividend-wrap">${toBengali(dividend)}</div>
                </div>
            `;
        }

        // Mathematical Problem Generators
        function generateMultiplicationProblems() {
            let html = '';
            for (let i = 1; i <= 20; i++) {
                let a, b;
                if (i <= 3) { 
                    a = randomInt(2, 9);
                    b = randomInt(2, 9);
                } else if (i <= 6) {
                    a = randomInt(100, 999);
                    b = (Math.random() < 0.7) ? randomInt(2, 9) : randomInt(10, 20);
                } else {
                    a = randomInt(10, 99);
                    b = randomInt(2, 9);
                }
                html += createVerticalMath('×', a, b);
            }
            return html;
        }

        function generateAdditionProblems() {
            let html = '';
            for (let i = 1; i <= 20; i++) {
                let a, b;
                if (i <= 6) {
                    a = randomInt(100, 999);
                    b = randomInt(100, 999);
                } else {
                    a = randomInt(10, 99);
                    b = randomInt(10, 99);
                }
                html += createVerticalMath('+', a, b);
            }
            return html;
        }

        function generateSubtractionProblems() {
            let html = '';
            for (let i = 1; i <= 30; i++) {
                let a, b;
                if (i <= 9) {
                    a = randomInt(200, 999);
                    b = randomInt(100, a);
                } else {
                    a = randomInt(20, 99);
                    b = randomInt(10, a);
                }
                html += createVerticalMath('-', a, b);
            }
            return html;
        }

        function generateDivisionProblems() {
            let html = '';
            for (let i = 1; i <= 30; i++) {
                let divisor, dividend;
                if (i <= 15) {
                    divisor = randomInt(2, 9);
                    let minQ = Math.ceil(10 / divisor);
                    let maxQ = Math.floor(99 / divisor);
                    let quotient = randomInt(minQ, maxQ);
                    dividend = divisor * quotient;
                } else {
                    if (Math.random() < 0.7) {
                        divisor = randomInt(2, 9);
                    } else {
                        divisor = randomInt(10, 25);
                    }
                    let minQ = Math.ceil(100 / divisor);
                    let maxQ = Math.floor(999 / divisor);
                    let quotient = randomInt(minQ, maxQ);
                    dividend = divisor * quotient;
                }
                html += createDivision(divisor, dividend);
            }
            return html;
        }

        // Responsive Workspace scaling for A4 pages
        function adjustScale() {
            const preview = document.querySelector('.workspace-preview');
            const container = document.getElementById('pages-container');
            if (!preview || !container) return;
            
            // Fixed base dimensions (width of A4 page is exactly 793px)
            const targetWidth = 793; 
            const previewWidth = preview.clientWidth - 16; // subtract padding
            
            if (previewWidth < targetWidth) {
                const scale = previewWidth / targetWidth;
                container.style.transform = `scale(${scale})`;
                container.style.transformOrigin = 'top center';
                
                // Set the wrapper container height dynamically to prevent empty scrolling space
                // A4 height is 1122px. 2 pages + 40px gap = 2284px
                const unscaledHeight = 2284;
                container.style.height = `${unscaledHeight * scale}px`;
            } else {
                container.style.transform = 'none';
                container.style.height = 'auto';
            }
        }

        // Show/Hide Loading Screen
        function toggleLoading(show, title = '', subtitle = '') {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                if (title) document.getElementById('loadingText').innerText = title;
                if (subtitle) document.getElementById('loadingSubtext').innerText = subtitle;
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // Generate the 2 A4 pages
        function generateSheet() {
            toggleLoading(true, "ওয়ার্কশিট তৈরি হচ্ছে...", "অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন");
            
            setTimeout(() => {
                const pagesContainer = document.getElementById('pages-container');
                pagesContainer.innerHTML = '';

                for (let pageNum = 1; pageNum <= 2; pageNum++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'worksheet-page';
                    pageDiv.id = `page-${pageNum}`;

                    pageDiv.innerHTML = `
                        <!-- Header -->
                        <div class="sheet-header">
                            <h1 class="sheet-title">গণিত অনুশীলন ওয়ার্কশিট (পৃষ্ঠা - ${toBengali(pageNum)})</h1>
                            <div class="student-info-grid">
                                <div class="info-field">নাম (Name): ________________________________________</div>
                                <div class="info-field">রোল (Roll): ________________</div>
                                <div class="info-field">তারিখ (Date): ______________</div>
                            </div>
                        </div>

                        <!-- Operations -->
                        <div class="sections-container">
                            <!-- 1. Multiplication Section (গুণ) -->
                            <div class="worksheet-section">
                                <div class="section-title">
                                    ১. গুণ করো (Multiplication)
                                    <span class="sub-title">১, ২ ও ৩-অংকের গুণ (1-digit, 2-digit & 3-digit multiplication)</span>
                                </div>
                                <div class="problem-grid">
                                    ${generateMultiplicationProblems()}
                                </div>
                            </div>

                            <!-- 2. Addition Section (যোগ) -->
                            <div class="worksheet-section">
                                <div class="section-title">
                                    ২. যোগ করো (Addition)
                                    <span class="sub-title">২-অংক ও ৩-অংকের যোগ (2-digit & 3-digit addition)</span>
                                </div>
                                <div class="problem-grid">
                                    ${generateAdditionProblems()}
                                </div>
                            </div>

                            <!-- 3. Subtraction Section (বিয়োগ) -->
                            <div class="worksheet-section">
                                <div class="section-title">
                                    ৩. বিয়োগ করো (Subtraction)
                                    <span class="sub-title">২-অংক ও ৩-অংকের বিয়োগ (2-digit & 3-digit subtraction)</span>
                                </div>
                                <div class="problem-grid">
                                    ${generateSubtractionProblems()}
                                </div>
                            </div>

                            <!-- 4. Division Section (ভাগ) -->
                            <div class="worksheet-section">
                                <div class="section-title">
                                    ৪. ভাগ করো (Division)
                                    <span class="sub-title">২-অংক ও ৩-অংকের ভাগ (2-digit & 3-digit division)</span>
                                </div>
                                <div class="problem-grid">
                                    ${generateDivisionProblems()}
                                </div>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="sheet-footer">
                            স্বাক্ষর (Signature): _____________________ &nbsp;|&nbsp; © গণিত অনুশীলন পত্র
                        </div>
                    `;

                    pagesContainer.appendChild(pageDiv);
                }

                adjustScale();
                toggleLoading(false);
            }, 300);
        }

        // Download both pages as a single compressed 2-page PDF
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const pages = document.querySelectorAll('.worksheet-page');
            
            toggleLoading(true, "পিডিএফ তৈরি হচ্ছে...", "হাই-কোয়ালিটি ফাইল সংক্ষেপণ করা হচ্ছে");

            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            let promiseChain = Promise.resolve();

            pages.forEach((pageElement, index) => {
                promiseChain = promiseChain.then(() => {
                    const originalShadow = pageElement.style.boxShadow;
                    pageElement.style.boxShadow = 'none';

                    // html2canvas rendering at exact pixel dimensions
                    return html2canvas(pageElement, { 
                        scale: 2.5, // High resolution crisp text scale
                        useCORS: true,
                        logging: false,
                        width: 793,
                        height: 1122
                    }).then(canvas => {
                        // JPEG format with 0.8 quality compression reduces file sizes significantly
                        const imgData = canvas.toDataURL('image/jpeg', 0.8);
                        
                        if (index > 0) {
                            pdf.addPage();
                        }
                        
                        // Add image to pdf sheet
                        pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                        
                        // Restore page box shadow
                        pageElement.style.boxShadow = originalShadow;
                    });
                });
            });

            promiseChain.then(() => {
                pdf.save('bengali-math-worksheet.pdf');
                toggleLoading(false);
            }).catch(err => {
                console.error(err);
                toggleLoading(false);
                alert("PDF তৈরি করতে একটি সমস্যা হয়েছে।");
            });
        }

        // Resize hook
        window.addEventListener('resize', adjustScale);

        // Initialize on load
        window.onload = generateSheet;
    </script>
</body>
</html>
