<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Ultimate Dashboard - By ANABRATA</title>
    
    <!-- Tab Icons -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================================
           CSS RESET & DESIGN SYSTEM
           ============================================================ */
        :root {
            --bg-color: #030305;
            --surface-color: rgba(13, 13, 20, 0.45);
            --surface-border: rgba(255, 255, 255, 0.07);
            --surface-border-hover: rgba(255, 255, 255, 0.15);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.35);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --glass-blur: blur(25px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Ambient Glowing Blobs */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            top: -200px;
            left: -200px;
            z-index: -2;
            animation: floatGlow 15s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: -2;
            animation: floatGlow2 12s infinite alternate-reverse ease-in-out;
            pointer-events: none;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, 100px) scale(1.15); }
        }

        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-100px, -150px) scale(0.9); }
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: #030305;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 4px solid rgba(255,255,255,0.03);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 10px var(--primary-glow));
            margin-bottom: 20px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: var(--text-main);
            text-transform: uppercase;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============================================================
           HEADER & NAV BAR
           ============================================================ */
        .header {
            position: sticky;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            background: rgba(3, 3, 5, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--surface-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            transition: var(--transition-smooth);
        }

        .header.scrolled {
            padding: 12px 40px;
            background: rgba(3, 3, 5, 0.8);
            border-color: rgba(255,255,255,0.05);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .logo-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            width: 340px;
            max-width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 11px 16px 11px 44px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--surface-border);
            border-radius: 30px;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            outline: none;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        .search-input:focus + .search-icon {
            color: var(--primary);
        }

        /* ============================================================
           TAB BAR (Category Switches)
           ============================================================ */
        .tab-bar-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .tab-bar {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--surface-border);
            padding: 6px;
            border-radius: 40px;
            display: flex;
            gap: 4px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .tab-btn {
            padding: 10px 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--text-main);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* ============================================================
           WEBSITES CONTENT GRID
           ============================================================ */
        .content-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
        }

        /* Grid Categories */
        .category-section {
            margin-bottom: 45px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .category-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--primary);
            border-radius: 4px;
            box-shadow: 0 0 8px var(--primary);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        /* Bookmark Card */
        .bookmark-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: var(--transition-bounce);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            height: 80px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .bookmark-card:hover {
            transform: translateY(-6px);
            border-color: var(--surface-border-hover);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .bookmark-card-top {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .bookmark-icon-wrap {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .bookmark-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .bookmark-emoji {
            font-size: 1.1rem;
        }

        .bookmark-info {
            flex: 1;
            min-width: 0;
        }

        .bookmark-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* ============================================================
           FLASHCARDS CONTENT GRID
           ============================================================ */
        .fc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* Flashcard Cover Card */
        .fc-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 24px;
            cursor: pointer;
            height: 160px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            transition: var(--transition-bounce);
        }

        .fc-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--surface-border-hover);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .fc-card-logo-wrap {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: auto; /* Push metadata to bottom */
        }

        .fc-card-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fc-card-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fc-card-stat {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .fc-note-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 0.95rem;
            opacity: 0.8;
            color: var(--primary);
        }

        /* ============================================================
           NOTEPAD OVERLAY SYSTEM
           ============================================================ */
        .notepad-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 5, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .notepad-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .notepad {
            width: 750px;
            max-width: 90%;
            height: 520px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            transition: var(--transition-bounce);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .notepad-overlay.active .notepad {
            transform: scale(1);
        }

        .notepad-header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--surface-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .notepad-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .notepad-body {
            flex: 1;
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .notepad-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1.05rem;
            line-height: 1.6;
            transition: var(--transition-smooth);
        }

        .notepad-textarea[readonly] {
            cursor: default;
        }

        .notepad-footer {
            padding: 16px 30px;
            border-top: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.01);
        }

        .notepad-info {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .notepad-btns {
            display: flex;
            gap: 12px;
        }

        .notepad-btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            transition: var(--transition-smooth);
        }

        .notepad-btn-close {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
        }

        .notepad-btn-close:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Responsive adjustments */
        @media(max-width: 768px) {
            .header { padding: 15px 20px; }
            .header.scrolled { padding: 10px 20px; }
            .content-container { padding: 0 20px 100px; }
            .search-wrapper { width: 100%; margin-top: 10px; order: 3; }
            .header { flex-wrap: wrap; }
            .fc-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        const bookmarks = [];

            if (!group) {

            group.links.push({ name, url, desc });

                name: name,

            setTimeout(() => {

            }, 1000);
        });

        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                document.getElementById('mainHeader').classList.add('scrolled');
            } else {
                document.getElementById('mainHeader').classList.remove('scrolled');
            }
        });

        // Helper to resolve Postimages share links to direct CDN images
        function resolveImageUrl(url) {
            if (!url) return '';
            const match = url.match(/(?:postimg\.cc|postimages\.org)\/([a-zA-Z0-9]+)/);
            if (match) {
                return `https://i.postimg.cc/${match[1]}/image.jpg`;
            }
            return url;
        }

        // Helper to extract clean hostname favicon
        function getIcon(url) {
            try {
                return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=128`;
            } catch { return ''; }
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================
        
        // Switch between tabs
        window.switchTab = function(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tabName === 'websites') {
                document.querySelector('.tab-btn[onclick="switchTab(\'websites\')"]').classList.add('active');
                document.getElementById('websitesTab').classList.add('active');
                renderBookmarks();
            } else {
                document.querySelector('.tab-btn[onclick="switchTab(\'flashcards\')"]').classList.add('active');
                document.getElementById('flashcardsTab').classList.add('active');
                renderFlashCards();
            }
        };

        // Render Bookmarks Grid
        function renderBookmarks(filter = '') {
            dashboard.innerHTML = '';
            const lowerFilter = filter.toLowerCase();

            bookmarks.forEach((group) => {
                const filteredLinks = group.links.filter(l => 
                    l.name.toLowerCase().includes(lowerFilter) || 
                    (l.desc && l.desc.toLowerCase().includes(lowerFilter))
                );

                if (filteredLinks.length === 0 && filter !== '') return;

                // Category Section Element
                const section = document.createElement('div');
                section.className = 'category-section';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `<h2 class="category-title">${group.category}</h2>`;
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'category-grid';

                filteredLinks.forEach(link => {
                    const card = document.createElement('div');
                    card.className = 'bookmark-card';
                    const iconUrl = getIcon(link.url);
                    
                    card.innerHTML = `
                        <div class="bookmark-card-top">
                            <div class="bookmark-icon-wrap">
                                <img src="${iconUrl}" class="bookmark-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <span class="bookmark-emoji" style="display:none;">🔗</span>
                            </div>
                            <div class="bookmark-info">
                                <div class="bookmark-name">${link.name}</div>
                                <div class="bookmark-desc">${link.desc || 'No description'}</div>
                            </div>
                        </div>
                    `;
                    card.onclick = () => {
                        window.location.href = link.url;
                    };
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                dashboard.appendChild(section);
            });

            if (dashboard.innerHTML === '' && filter !== '') {
                dashboard.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px;">No matching links found.</div>`;
            }
        }

        // Render Flashcards Grid
        function renderFlashCards() {
            flashcardsArea.innerHTML = '';

            if (flashCards.length === 0) {
                flashcardsArea.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); margin-top: 40px;">No flashcards found. Edit FLASHCARDS in index.html to add some.</div>`;
                return;
            }

            flashCards.forEach(fc => {
                const card = document.createElement('div');
                card.className = 'fc-card';
                
                const imageUrl = resolveImageUrl(fc.image || '');
                const hasNote = fc.note && fc.note.trim().length > 0;
                
                const chars = fc.note ? fc.note.length : 0;
                const words = fc.note ? fc.note.trim().split(/\s+/).filter(w => w).length : 0;

                card.innerHTML = `
                    <div class="fc-card-logo-wrap">
                        <img class="fc-card-logo-img" src="${imageUrl}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">

                    </div>
                    ${hasNote ? '<div class="fc-note-badge">📝</div>' : ''}
                    <div class="fc-card-title" style="margin-top: 15px;">${fc.name}</div>
                    <div class="fc-card-stat">${words} Words · ${chars} Chars</div>
                `;
                
                card.onclick = () => {
                    openNotepad(fc.id);
                };
                
                flashcardsArea.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            if (currentTab === 'websites') {

        // CUSTOM NOTEPAD SYSTEM

        const notepadOverlay = document.getElementById('notepadOverlay');

        const notepadCounts = document.getElementById('notepadCounts');

        window.openNotepad = function(fcId) {
            const fc = flashCards.find(c => c.id === fcId);
            if (!fc) return;

            currentNotepadFcId = fcId;
            
            document.getElementById('notepadTitle').textContent = fc.name;
            notepadTextarea.value = fc.note || '';
            
            const logoImg = document.getElementById('notepadLogo').querySelector('img');
            const imageUrl = resolveImageUrl(fc.image || '');
            logoImg.src = imageUrl;
            logoImg.style.display = 'block';
            logoImg.nextElementSibling.style.display = 'none';

            updateWordCount(fc.note || '');
            notepadOverlay.classList.add('active');
        };

        window.closeNotepad = function() {
            notepadOverlay.classList.remove('active');
            currentNotepadFcId = null;
            renderFlashCards();
        };

        function updateWordCount(text) {
            const charCount = text.length;
            const wordCount = text.trim().split(/\s+/).filter(w => w).length;
            notepadCounts.textContent = `${charCount} characters · ${wordCount} words`;
        }

        // ON LOAD INITIALIZATION
        // ============================================================
        renderBookmarks();
